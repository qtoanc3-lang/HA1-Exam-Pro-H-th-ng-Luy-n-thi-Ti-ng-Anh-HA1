<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HA1 Exam Pro — Hệ thống Luyện thi Tiếng Anh HA1</title>
    <meta name="description" content="Phòng thi mô phỏng chuẩn Tiếng Anh HA1 tích hợp đầy đủ 3 kỹ năng Listening, Reading và Writing có chấm điểm tự động và giải thích chi tiết." />
    <meta property="og:title" content="HA1 Exam Pro — Hệ thống Luyện thi Tiếng Anh HA1" />
    <meta property="og:description" content="Phòng thi mô phỏng chuẩn Tiếng Anh HA1 tích hợp đầy đủ 3 kỹ năng Listening, Reading và Writing có chấm điểm tự động và giải thích chi tiết." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-indigo-600/15 selection:text-indigo-700 dark:selection:bg-indigo-400/20 dark:selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- GitHub Pages root fallback: if served unbuilt from repo root, auto-redirect to prebuilt ./docs/ -->
    <script data-gh-pages-fallback>
      (function () {
        if (document.querySelector('script[src*="@vite/client"]')) return;
        var entry = document.querySelector('script[src="/src/main.tsx"]');
        if (!entry) return;
        var triggered = false;
        function handleUnbuiltStaticHost() {
          if (triggered || window.__HA1_APP_MOUNTED__) return;
          triggered = true;
          fetch('./docs/index.html', { method: 'HEAD' })
            .then(function (res) {
              if (res.ok && !window.__HA1_APP_MOUNTED__) {
                window.location.replace('./docs/' + window.location.search + window.location.hash);
                return;
              }
              showSetupNotice();
            })
            .catch(showSetupNotice);
        }
        function showSetupNotice() {
          if (window.__HA1_APP_MOUNTED__) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="max-width:560px;margin:64px auto;padding:28px;border-radius:20px;background:#ffffff;border:1px solid #e2e8f0;font-family:system-ui,-apple-system,sans-serif;color:#0f172a;box-shadow:0 10px 30px rgba(15,23,42,0.08)">' +
            '<h1 style="margin:0 0 10px;font-size:20px;font-weight:700;color:#4f46e5">HA1 Exam Pro — Cần chọn nguồn GitHub Pages</h1>' +
            '<p style="margin:0 0 12px;font-size:14px;line-height:1.6;color:#475569">Trang này đang phục vụ tệp nguồn chưa biên dịch (<code>index.html</code> ở thư mục gốc). Để ứng dụng chạy ngay, hãy vào <strong>Settings → Pages → Build and deployment</strong> và chọn một trong hai cách:</p>' +
            '<ol style="margin:0;padding-left:20px;font-size:14px;line-height:1.7;color:#334155">' +
            '<li>Đổi <strong>Source</strong> thành <strong>GitHub Actions</strong> (khuyên dùng).</li>' +
            '<li>Hoặc giữ <strong>Deploy from a branch</strong> nhưng đổi thư mục từ <code>/ (root)</code> sang <code>/docs</code>.</li>' +
            '</ol></div>';
        }
        entry.addEventListener('error', handleUnbuiltStaticHost);
        window.setTimeout(handleUnbuiltStaticHost, 900);
      })();
    </script>
  </body>
</html>
